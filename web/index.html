<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookingApi</title>
    <script>
      // Applies the saved theme before the first paint, so a dark-theme user never sees a white flash while the app
      // loads. ThemeProvider takes over afterwards; keep the storage key and logic in sync with src/theme/.
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
